<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker with all the cards</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="setup-container">
        <div class="input-group">
            <label for="roomId">ルームID:</label>
            <input type="text" id="roomId" placeholder="ルームIDを入力">
        </div>
        <div class="input-group">
            <label for="playerName">プレイヤー名:</label>
            <input type="text" id="playerName" placeholder="プレイヤー名を入力">
        </div>
    </div>
    <button id="joinButton">ルームに参加</button>

    <div id="game-stats">
        <p>ラウンド数: <span id="round-count">1</span></p>
    </div>
    
    <div class="player-area">
        <h2>Opponent's Cards</h2>
        <div id="opponent-cards" class="card-row"></div>
    </div>    

    <div class="player-area">
        <h2>Selected Cards</h2>
        <div id="selected-cards" class="card-row"></div>
    </div>
    
    <div class="player-area">
        <h2>Your Cards</h2>
        <div id="your-cards" class="card-row"></div>
        <button id="confirm-selection" disabled>準備OK</button>
    </div>



    <!-- ラウンド結果モーダルは html/round_result_modal.html から動的に読み込む -->
    <!-- 最終結果モーダルは html/result_modal.html から動的に読み込む -->

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
